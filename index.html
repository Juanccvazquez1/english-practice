<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="eds-offline" content="1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<title>English from scratch</title>
<style>
/* Layout: app tipo iOS — títulos grandes, listas agrupadas, tab bar translúcida abajo;
   las lecciones abren a pantalla completa con botón fijo abajo y hoja de feedback. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#6C6C70; --sep:rgba(60,60,67,.16); --fill:#E9E9EE;
  --accent:#E8890C; --accent-soft:#FDEBD3; --accent-ink:#FFFFFF;
  --ok:#24A148; --ok-bg:#E2F5E7; --bad:#E0383B; --bad-bg:#FCE6E6; --bar:rgba(246,246,248,.84);
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --round:ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:16px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --sep:rgba(84,84,88,.55); --fill:#2C2C2E;
    --accent:#FFA53A; --accent-soft:#3A2810; --accent-ink:#1A1206;
    --ok:#32D74B; --ok-bg:#0E2A16; --bad:#FF6961; --bad-bg:#3A1513; --bar:rgba(18,18,20,.84); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --sep:rgba(84,84,88,.55); --fill:#2C2C2E;
  --accent:#FFA53A; --accent-soft:#3A2810; --accent-ink:#1A1206;
  --ok:#32D74B; --ok-bg:#0E2A16; --bad:#FF6961; --bad-bg:#3A1513; --bar:rgba(18,18,20,.84); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
body{overflow-y:auto}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Barra superior compacta (aparece al hacer scroll) ---------- */
.navbar{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 8px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:44px;
  background:transparent;border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.navbar.solid{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom-color:var(--sep)}
.navbar .small-title{flex:1;text-align:center;font-weight:600;opacity:0;transition:opacity .2s}
.navbar.solid .small-title{opacity:1}
.navbar .side{width:88px;display:flex;align-items:center}
.navbar .side.right{justify-content:flex-end}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;min-height:44px}
.cloud{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.cloud i{width:8px;height:8px;border-radius:99px;background:var(--muted);display:inline-block}
.cloud.on i{background:var(--ok)}

main{max-width:680px;margin:0 auto;padding:0 16px calc(var(--sab) + 110px);display:flex;flex-direction:column;gap:22px}
.large{font-family:var(--round);font-size:34px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.section-h{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px 16px}
.muted{color:var(--muted)} .small{font-size:15px} .tiny{font-size:13px}

/* ---------- Tarjetas y listas agrupadas ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:1px solid var(--sep)}
.list.plain .row+.row::before{left:16px}
button.row:active,a.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600} .row .d{font-size:14px;color:var(--muted)}
.chev{color:var(--muted);opacity:.6;width:16px;height:16px}
.badge-n{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--round);font-weight:800;display:grid;place-items:center;flex:none;font-size:17px}
.pill{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--fill);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- Botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:600;font-size:17px;background:var(--fill);color:var(--ink);width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.okb{background:var(--ok);color:#fff} .btn.badb{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.inline{width:auto}
.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}

/* ---------- Inicio ---------- */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--round);font-weight:800;font-size:22px;line-height:1}
.ring .lbl small{display:block;font-size:11px;font-weight:600;color:var(--muted);font-family:var(--sans)}
.stats{display:flex;flex-direction:column;gap:6px}
.stat{display:flex;align-items:center;gap:8px;font-size:15px}
.stat b{font-family:var(--round);font-size:20px}
.mini-ring{width:30px;height:30px;flex:none}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}

/* ---------- Unidad ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:10px;padding:2px}
.seg button{min-height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
details.learn{background:var(--card);border-radius:var(--r)}
details.learn>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;font-weight:600}
details.learn>summary::-webkit-details-marker{display:none}
details.learn>summary .chev{transition:transform .2s;margin-left:auto}
details.learn[open]>summary .chev{transform:rotate(90deg)}
.learn-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:16px}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none}
.tbl{overflow-x:auto}
.learn-body table{border-collapse:collapse;width:100%;font-size:15px}
.learn-body th,.learn-body td{border-bottom:1px solid var(--sep);padding:7px 6px;text-align:left;vertical-align:top}
.learn-body th{font-size:13px;color:var(--muted);font-weight:600}
.learn-body ul,.learn-body ol{margin:0;padding-left:1.2rem}
.watch div{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:15px}
.watch{display:flex;flex-direction:column;gap:6px}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.right{color:var(--ok);font-weight:600}
.word{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--sep)}
.word:first-child{border-top:0}
.spk{width:36px;height:36px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.spk .svg{width:18px;height:18px}
textarea.field,input.field{font:inherit;font-size:17px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);color:var(--ink)}
textarea.field{min-height:150px;resize:vertical}
.fbw{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fbw.ok{background:var(--ok-bg)} .fbw.bad{background:var(--bad-bg)}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--sep);padding-bottom:var(--sab)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--muted);font-size:10.5px;font-weight:600;min-height:50px;position:relative}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar .svg{width:25px;height:25px}
.tabbar .dot{position:absolute;top:3px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;min-width:18px;line-height:18px;text-align:center}
body.insession .tabbar{display:none}
body.insession{overflow:hidden}

/* ---------- Lección a pantalla completa ---------- */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.s-top{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 16px 10px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:99px;color:var(--muted)}
.iconbtn:active{background:var(--fill)}
.pbar{flex:1;height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.s-body{flex:1;overflow-y:auto;padding:8px 16px 24px}
.s-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.where{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.q-instr{font-family:var(--round);font-size:22px;font-weight:700;line-height:1.25}
.prompt{font-size:21px;line-height:1.75}
.prompt input{font:inherit;font-weight:700;font-size:20px;line-height:1.3;color:var(--ink);background:var(--fill);border:0;border-bottom:3px solid var(--accent);border-radius:8px 8px 2px 2px;padding:2px 8px;margin:0 6px;width:9ch;min-width:6ch;max-width:100%;vertical-align:baseline;-webkit-appearance:none;appearance:none;outline:none;box-shadow:none;transition:background .15s}
.prompt input:focus{background:var(--accent-soft)}
.prompt input[readonly]{background:transparent}
input.field:focus,textarea.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:focus-visible,textarea:focus-visible{outline:none}
.task{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--sep);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;font-size:18px;min-height:54px;border-bottom-width:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-content:flex-start}
.chip{border:2px solid var(--sep);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600;font-size:18px;animation:pop .15s ease}
.answer-line{border-bottom:2px solid var(--sep);padding-bottom:10px;min-height:64px}
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.flash .es{font-family:var(--round);font-size:28px;font-weight:800}
.flash .en{font-family:var(--round);font-size:26px;font-weight:800;color:var(--accent)}
.s-foot{padding:12px 16px calc(var(--sab) + 14px);border-top:1px solid var(--sep);background:var(--bg)}
.s-foot-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet{animation:up .22s ease;border-top:0}
.sheet.ok{background:var(--ok-bg)} .sheet.bad{background:var(--bad-bg)}
.sheet .ttl{display:flex;align-items:center;gap:10px;font-family:var(--round);font-size:22px;font-weight:800}
.sheet.ok .ttl{color:var(--ok)} .sheet.bad .ttl{color:var(--bad)}
.sheet .ans{font-size:17px}
.sheet .exp{font-size:15px;color:var(--ink);opacity:.85}
.shake{animation:shake .35s ease}
.celebrate{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.big-ring{width:150px;height:150px;position:relative}
.big-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.big-ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:36px}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
.modal .grab{width:36px;height:5px;border-radius:99px;background:var(--sep);margin:-8px auto 6px}
/* ---------- Habilidades ---------- */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skill{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:140px}
.skill:active{transform:scale(.98)}
.skill .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.skill .t{font-family:var(--round);font-weight:800;font-size:19px}
.skill .d{font-size:13px;color:var(--muted);flex:1}
.skill .pill{align-self:flex-start}
.reading p{font-size:18px;line-height:1.65;margin:0 0 12px}
.gloss{display:flex;flex-wrap:wrap;gap:6px}
.gloss span{background:var(--fill);border-radius:8px;padding:4px 8px;font-size:14px}
.player{display:flex;align-items:center;gap:12px}
.play{width:64px;height:64px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play .svg{width:28px;height:28px}
.ctx{background:var(--card);border-radius:14px}
.ctx>summary{padding:12px 14px;font-weight:600;cursor:pointer;color:var(--accent);list-style:none}
.ctx>summary::-webkit-details-marker{display:none}
.ctx .reading{padding:0 14px 6px}
.ctx .reading p{font-size:16px}
.line{display:flex;gap:8px;padding:6px 0;font-size:16px}
.line b{flex:none;color:var(--accent)}
.mic{width:52px;height:52px;border-radius:99px;background:var(--fill);color:var(--ink);display:grid;place-items:center;flex:none}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.cmp .hit{color:var(--ok);font-weight:600} .cmp .miss{color:var(--bad);text-decoration:underline}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(224,56,59,.18)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* ---------- Sensación de app nativa ---------- */
html{overscroll-behavior:none}
button,a,.row,.chip,.opt,summary{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.row,.skill,.opt,.chip,.btn,details.learn>summary{transition:transform .12s ease, background-color .15s ease}
button.row:active,a.row:active,.skill:active,details.learn>summary:active{transform:scale(.985)}
.opt:active,.chip:active{transform:scale(.96)}
.tabbar{view-transition-name:tabbar}
.navbar{view-transition-name:navbar}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
html[data-vt="fwd"]::view-transition-old(root){animation-name:vt-out-left}
html[data-vt="fwd"]::view-transition-new(root){animation-name:vt-in-right}
html[data-vt="back"]::view-transition-old(root){animation-name:vt-out-right}
html[data-vt="back"]::view-transition-new(root){animation-name:vt-in-left}
html[data-vt="fade"]::view-transition-old(root){animation:vt-fade-out .18s ease both}
html[data-vt="fade"]::view-transition-new(root){animation:vt-fade-in .22s ease both}
@keyframes vt-in-right{from{transform:translateX(35%);opacity:0}}
@keyframes vt-out-left{to{transform:translateX(-20%);opacity:0}}
@keyframes vt-in-left{from{transform:translateX(-35%);opacity:0}}
@keyframes vt-out-right{to{transform:translateX(20%);opacity:0}}
@keyframes vt-fade-in{from{opacity:0;transform:translateY(6px)}}
@keyframes vt-fade-out{to{opacity:0}}
.session.enter{animation:sess-up .34s cubic-bezier(.2,.8,.2,1)}
.session.leaving{animation:sess-down .26s ease-in both}
.s-inner.q-in{animation:q-in .3s cubic-bezier(.2,.8,.2,1)}
.fb-pop{animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes sess-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes sess-down{to{transform:translateY(100%)}}
@keyframes q-in{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
main{animation:vt-fade-in .2s ease}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="navbar" id="navbar">
  <div class="side" id="navLeft"></div>
  <div class="small-title" id="smallTitle"></div>
  <div class="side right"><span class="cloud" id="sync"><i></i><span>…</span></span></div>
</header>
<main id="view"><div class="card"><p class="muted">Loading your material…</p></div></main>
<nav class="tabbar" aria-label="Sections"><div class="tabbar-in">
  <a href="#inicio" data-r="inicio"><svg class="svg" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#repaso" data-r="repaso"><svg class="svg" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Review<span class="dot" id="dueDot" hidden></span></a>
  <a href="#progreso" data-r="progreso"><svg class="svg" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
  <a href="#recursos" data-r="recursos"><svg class="svg" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M8 7h7"/></svg>Library</a>
</div></nav>
<div id="sessionRoot"></div>

<script>
"use strict";
/* ================= Utilidades ================= */
// append/replaceChildren convierten null en el texto "null": filtrarlos en toda la app.
for (const m of ["append","prepend","replaceChildren"]){
  const orig=Element.prototype[m];
  Element.prototype[m]=function(...kids){ return orig.apply(this, kids.filter(k=>k!=null && k!==false)); };
}
const $ = (s, el=document) => el.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k==="html") el.innerHTML=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
function svg(path, cls="svg"){ const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class",cls); s.innerHTML=path; return s; }

function norm(s, keepCase){

}

  const g = norm(given, item.case); if(!g) return {ok:false};

  if (item.case && answers.map(a=>a.toLowerCase()).includes(g.toLowerCase())) return {ok:false, caseOnly:true};

}

      catch(e){ dirty.add(k); if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); } else { console.warn(e); S.cloudErr=e.code||"error"; break; } }

  else { r.b=0; r.d=Date.now()+10*60000; }

  const st=stats(), k=dayKey(); st.days[k]=(st.days[k]||0)+1; touch("_stats");
}

  if(!days[dayKey(t)]) t-=DAY;
  for(let i=0;i<400;i++,t-=DAY){ if(days[dayKey(t)]){ n++; gap=0; } else { gap++; if(gap>1) break; } }
  return n;
}
function allEntries(){

/* Lee una conversación con voces distintas. rate: 1 normal, 0.8 lento. */
async function speakLines(lines, rate=1, onLine){

  if (S.tts && !lines.some(l=>l.lang)){
    try{
      const ids=lines.map((l,i)=>({text:l.text, voice:l.voice||"buttery", language:"en", rate, id:"l"+i}));
      S.lineCb = onLine? (id)=>{ if(id) onLine(+String(id).slice(1)); } : null;
      await S.tts.speak(ids); speakingNow=false; S.lineCb=null; return;
    }catch(e){ if(e&&e.code==="not_granted") S.tts=null; else { speakingNow=false; return; } }
  }

    await new Promise(res=>{ const u=new SpeechSynthesisUtterance(l.text); u.lang=l.lang||"en-US"; u.rate=.95*rate;

function localCheck(text,{spoken}={}){

    if (spoken && R.cap) continue;

    while ((m=R.re.exec(text))){
      if (m[0]==="" ) { R.re.lastIndex++; continue; }
      if (R.test && !R.test(m, text.slice(0,m.index))) continue;
      const wrong=(R.wrong? R.wrong(m) : m[0]).trim(), right=R.fix(m).trim();
      if (!wrong || wrong===right) continue;
      const k=R.id+"|"+wrong.toLowerCase(); if(seen.has(k)) continue; seen.add(k);
      errs.push({r:R.id, wrong, right, why:R.why, _a:m.index, _b:m.index+m[0].length, _cap:!!R.cap});
      if (errs.length>=25) break;

  // si una mayúscula coincide con otro error más útil en el mismo lugar, se queda el otro
  const ov=(a,b)=>a._a<b._b && b._a<a._b;
  return errs.filter((e,i)=>!(e.r==="start-lower" && errs.some(o=>o!==e && !o._cap && ov(o,e) && /^[A-Z]/.test(o.right))) && !(!e._cap && errs.some((o,j)=>j<i && !o._cap && o._a<=e._a && e._b<=o._b)))

}

  const s=S.session; S.session=null; stopSpeaking();
  const el=$("#sessionRoot .session");
  const done=()=>{ document.body.classList.remove("insession"); $("#sessionRoot").replaceChildren(); if(s) s.onExit(); };
  if (el && !REDUCED){ el.classList.add("leaving"); setTimeout(done, 240); } else done();
}
function confirmExit(){
  const s=S.session; if(!s || s.i===0) return closeSession();
  const back=h("div",{class:"modal-back",onclick:(e)=>{ if(e.target===back) back.remove(); }},
    h("div",{class:"modal",role:"dialog","aria-label":"Exit lesson"}, h("div",{class:"grab"}),
      h("strong",{style:"text-align:center;font-size:18px"},"Exit lesson?"),
      h("p",{class:"small muted",style:"text-align:center"},`You're at ${s.i} of ${s.entries.length}. Your answers are already saved.`),
      h("button",{class:"btn primary",onclick:()=>back.remove()},"Keep practicing"),
      h("button",{class:"btn",style:"color:var(--bad)",onclick:()=>{back.remove();closeSession();}},"Exit")));
  document.body.append(back);
}
function sessionShell(){
  const s=S.session, root=$("#sessionRoot");
  const muteBtn=h("button",{class:"iconbtn","aria-label":muted()?"Turn sound on":"Mute",onclick:()=>{ try{localStorage.setItem(LSM,muted()?"0":"1");}catch{} muteBtn.replaceChildren(svg(muted()?IC.mute:IC.spk)); }}, svg(muted()?IC.mute:IC.spk));
  const first = !s._shown; s._shown=true;
  const body=h("div",{class:"s-inner"+(first?"":" q-in")}), foot=h("div",{class:"s-foot-in"}), footer=h("div",{class:"s-foot"},foot);
  const bar=h("i",{style:`width:${s._pct||0}%`});   // parte del valor anterior para que la barra avance con suavidad
  root.replaceChildren(h("div",{class:"session"+(first?" enter":""),role:"dialog","aria-label":s.title},
    h("div",{class:"s-top"}, h("button",{class:"iconbtn","aria-label":"Exit",onclick:confirmExit}, svg(IC.x)),
      h("div",{class:"pbar","aria-label":`Question ${Math.min(s.i+1,s.entries.length)} of ${s.entries.length}`}, bar), muteBtn),
    h("div",{class:"s-body"}, body), footer));
  s._pct = 100*s.i/s.entries.length;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.width=s._pct+"%"; }));
  return {body, foot, footer};
}
/* ===== Dificultad (sin tokens): pasar de reconocer a recordar =====
   normal = como siempre · smart = la 1.ª vez normal; si ya lo acertaste, lo escribes tú · hard = siempre escribes */
const DIFF_KEY="ingles-desde-cero-diff";
function diff(){ try{ return localStorage.getItem(DIFF_KEY)||"smart"; }catch{ return "smart"; } }
function setDiff(d){ try{ localStorage.setItem(DIFF_KEY,d); }catch{} }
const FIXED_OPTS=/^(true|false|both|neither|all of|none of|a and b|yes|no)\b/i;
function wantsHard(e){ const d=diff(); if(d==="hard") return true; if(d!=="smart") return false; const r=rec(e.level,e.key); return !!(r&&r.r===1); }
function harden(it){
  if (it.type==="choice"){
    const ok=String(it.options[it.answer]||"").trim();
    if (!it.audio && /_{2,}/.test(it.prompt) && !it.options.some(o=>FIXED_OPTS.test(String(o).trim()))
        && /^[A-Za-z][A-Za-z' -]*$/.test(ok) && ok.split(/\s+/).length<=4 && !/^(nothing|no article|none)$/i.test(ok))
      return {...it, type:"gap", answers:[ok], prompt:`${it.prompt} (starts with “${ok[0]}”)`, hard:true};
    return it;
  }
  if (it.type==="order" || it.type==="flash") return {...it, typed:true, hard:true};
  return it;
}
function flashAnswers(en){ const base=String(en).replace(/\([^()]*\)/g," ").trim(); return [...new Set([base, ...base.split(/\s*[\/,;]\s*/)].map(x=>x.trim()).filter(Boolean))]; }
function drawItem(){
  const s=S.session; if(!s) return;
  if (s.i>=s.entries.length) return drawSummary();
  const e=s.entries[s.i], {body,foot,footer}=sessionShell();
  if (!s.hard) s.hard={};
  if (!(s.i in s.hard)) s.hard[s.i]=wantsHard(e);   // se decide una vez por ejercicio (antes de calificarlo)
  const it = s.hard[s.i]? harden(e.item) : e.item;
  body.append(h("div",{class:"where"},e.where));
  if (e.ctx&&e.ctx.reading){ const R=e.ctx.reading;
    body.append(h("details",{class:"ctx",open:s.i===0||null}, h("summary",{},"Show the text"), h("div",{class:"reading"}, ...R.paragraphs.map(p=>h("p",{},p))))); }
  if (e.ctx&&e.ctx.listening){ const L=e.ctx.listening; let rate=1;
    const pb=h("button",{class:"play",style:"width:48px;height:48px","aria-label":"Listen to the conversation"}, svg(IC.play));
    pb.onclick=async()=>{ if(speakingNow){ stopSpeaking(); pb.replaceChildren(svg(IC.play)); return; } pb.replaceChildren(svg(IC.stop)); await speakLines(L.lang? L.lines.map(l=>({...l,lang:L.lang})) : L.lines,rate); pb.replaceChildren(svg(IC.play)); };
    body.append(h("div",{class:"ctx",style:"display:flex;align-items:center;gap:12px;padding:10px 14px"}, pb, h("span",{class:"small"},"Listen to the conversation (as many times as you like)"))); }
  const task=h("div",{class:"task"});
  let getAnswer=()=> "", focusEl=null, onReady=()=>{};

  if (it.type==="flash" && it.typed){
    const ans=flashAnswers(it.en), first=(ans[0]||"?")[0];
    body.append(h("div",{class:"q-instr"},"Write it in English"), task);
    const inp=h("input",{class:"field",id:"ans",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false","aria-label":"Answer",enterkeyhint:"done",placeholder:`Starts with “${first}”…`});
    task.append(h("div",{class:"flash"}, h("div",{class:"es"},it.es)), inp);
    const btn=h("button",{class:"btn primary",disabled:true,onclick:()=>done()},"Check");
    inp.addEventListener("input",()=>btn.disabled=inp.value.trim()==="");
    inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&inp.value.trim()){ ev.preventDefault(); done(); } });
    foot.append(btn);
    function done(){ const g=grade({type:"gap",answers:ans},inp.value); inp.readOnly=true;
      record(e.level,e.key,g.ok,true,inp.value); s.results[s.i]=g.ok; tone(g.ok?"ok":"bad"); speak(it.en);
      task.append(h("div",{class:"flash"}, h("div",{class:"en"},it.en), it.ipa? h("div",{class:"muted"},it.ipa):null, spk(it.en), it.example? h("p",{class:"muted small"},it.example):null));
      footer.classList.add("sheet", g.ok?"ok":"bad");
      foot.replaceChildren(h("div",{class:"ttl fb-pop"}, svg(g.ok?IC.check:IC.cross), g.ok?"Correct!": g.close?"Almost: check the spelling":"Not quite"),
        h("button",{class:"btn "+(g.ok?"okb":"badb"),onclick:()=>{s.i++;drawItem();}}, s.i+1<s.entries.length?"Continue":"See results"),
        !g.ok? h("button",{class:"btn",style:"min-height:40px;font-size:15px",onclick:()=>{ const r=rec(e.level,e.key); if(r){ r.f=Math.max(0,(r.f||1)-1); } record(e.level,e.key,true,false); s.results[s.i]=true; s.i++; drawItem(); }},"My answer is also correct"):null); }
    return;
  }
  if (it.type==="flash"){
    body.append(h("div",{class:"q-instr"},"How do you say it in English?"), task);
    task.append(h("div",{class:"flash"}, h("div",{class:"es"},it.es)));
    const reveal=h("button",{class:"btn primary",onclick:()=>{
      task.replaceChildren(h("div",{class:"flash"}, h("div",{class:"muted"},it.es), h("div",{class:"en"},it.en), it.ipa? h("div",{class:"muted"},it.ipa):null, spk(it.en), it.example? h("p",{class:"muted small"},it.example):null));
      speak(it.en);
      foot.replaceChildren(h("div",{class:"btns"},
        h("button",{class:"btn",onclick:()=>finishFlash(false)},"I didn't know it"),
        h("button",{class:"btn okb",onclick:()=>finishFlash(true)},"I knew it")));
    }},"Show answer");
    foot.append(reveal);
    function finishFlash(ok){ record(e.level,e.key,ok,true); s.results[s.i]=ok; tone(ok?"ok":"bad"); s.i++; drawItem(); }
    return;
  }

  const instr = it.hard && it.type==="gap"? "Complete it yourself (no options)" : it.type==="fix"? "Fix the sentence" : it.type==="translate"? "Write it in English" : it.type==="order"? (it.typed? "Write the sentence with these words" : "Put the words in order") : it.type==="dictation"? "Listen and write what you hear" : (e.instructions||(e.ctx?"Answer":"Complete"));
  body.append(h("div",{class:"q-instr"},instr), task);
  const checkBtns = h("div",{class:"btns"},
    h("button",{class:"btn",disabled:true,onclick:()=>check(false)},"Not sure"),
    h("button",{class:"btn primary",disabled:true,onclick:()=>check(true)},"Check"));
  const setReady=(ok)=>checkBtns.querySelectorAll("button").forEach(b=>b.disabled=!ok);

  if (it.type==="gap"){
    const parts=String(it.prompt).split(/_{2,}/);
    const inp=h("input",{id:"ans",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false","aria-label":"Answer",enterkeyhint:"done"});
    task.append(h("p",{class:"prompt"}, parts[0], inp, parts.slice(1).join("___")));
    getAnswer=()=>inp.value; focusEl=inp;
    inp.addEventListener("input",()=>{ inp.style.width=Math.max(6,inp.value.length+2)+"ch"; setReady(inp.value.trim()!==""); });
  } else if (it.type==="choice"){
    task.append(h("p",{class:"prompt"},it.prompt)); let sel=null;
    if (it.audio){ const pb=h("button",{class:"play","aria-label":"Listen"}, svg(IC.play)); pb.onclick=()=>speak(it.audio);
      task.append(h("div",{class:"player"}, pb, h("span",{class:"small muted"},"Listen and choose"))); setTimeout(()=>speak(it.audio),250); }
    // Orden aleatorio de las opciones (la respuesta correcta no siempre en el mismo lugar), salvo True/False y "all/both/none".
    const fixedOrder = it.options.some(o=>/^(true|false|both|neither|all of|none of|a and b|yes|no)\b/i.test(String(o).trim()));
    const order = fixedOrder? it.options.map((_,k)=>k) : shuffle(it.options.map((_,k)=>k));
    const opts=h("div",{class:"opts"}, ...order.map(k=>[it.options[k],k]).map(([o,k])=>h("button",{class:"opt",type:"button","aria-pressed":"false",onclick:(ev)=>{ sel=k; opts.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed","false")); ev.currentTarget.setAttribute("aria-pressed","true"); setReady(true); }},o)));
    body.append(opts); getAnswer=()=>sel;
  } else if (it.type==="order" && it.typed){
    if (it.prompt && !/^(ordena|put the words|order)/i.test(it.prompt)) task.append(h("p",{class:"small muted"},it.prompt));
    task.append(h("p",{class:"prompt",style:"font-weight:600"}, shuffle(it.words).join("  ·  ")));
    const inp=h("textarea",{class:"field",id:"ans",rows:"2",autocomplete:"off",autocorrect:"off",spellcheck:"false","aria-label":"Your sentence",placeholder:"Write the whole sentence…",enterkeyhint:"done"});
    task.append(inp); getAnswer=()=>inp.value; focusEl=inp;
    inp.addEventListener("input",()=>setReady(inp.value.trim()!==""));
  } else if (it.type==="order"){
    const line=h("div",{class:"chips answer-line","aria-label":"Your sentence"}), pool=h("div",{class:"chips"});
    const bag=shuffle(it.words), picked=[];
    const draw=()=>{ line.replaceChildren(...picked.map((w,k)=>h("button",{class:"chip",type:"button",onclick:()=>{picked.splice(k,1);draw();}},w)));
      const left=bag.slice(); for(const w of picked){const k=left.indexOf(w); if(k>=0) left.splice(k,1);}
      pool.replaceChildren(...left.map(w=>h("button",{class:"chip",type:"button",onclick:()=>{picked.push(w);draw();}},w))); setReady(picked.length>0); };
    if (it.prompt && !/^(ordena|put the words|order)/i.test(it.prompt)) task.append(h("p",{class:"small muted"},it.prompt));
    task.append(line); body.append(pool); draw(); getAnswer=()=>picked.join(" ");
  } else if (it.type==="dictation"){
    const pb=h("button",{class:"play","aria-label":"Listen"}, svg(IC.play)), slow=h("button",{class:"btn inline",style:"min-height:44px"},"Slower");
    pb.onclick=()=>speak(it.text,it.lang); slow.onclick=()=>speakLines([{who:"A",voice:"buttery",text:it.text,lang:it.lang}],.7);
    task.append(h("div",{class:"player"}, pb, slow));
    const inp=h("textarea",{class:"field",id:"ans",rows:"2",autocomplete:"off",autocorrect:"off",spellcheck:"false","aria-label":"What you heard",placeholder:"Type what you heard…",enterkeyhint:"done"});
    task.append(inp); getAnswer=()=>inp.value; focusEl=inp;
    inp.addEventListener("input",()=>setReady(inp.value.trim()!==""));
    setTimeout(()=>speak(it.text,it.lang),250);
  } else {
    task.append(h("p",{class:"prompt",style:"font-weight:600"}, it.prompt));
    const inp=h("textarea",{class:"field",id:"ans",rows:"2",autocomplete:"off",autocorrect:"off",spellcheck:"false","aria-label":"Your answer",placeholder:"Write the full sentence…",enterkeyhint:"done"});
    task.append(inp); getAnswer=()=>inp.value; focusEl=inp;
    inp.addEventListener("input",()=>setReady(inp.value.trim()!==""));
  }
  foot.append(checkBtns);
  // En pantallas táctiles (iPhone) no se enfoca solo: Safari no abre el teclado sin un toque y solo quedaría el marco.
  const touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (focusEl){ if(!touch) setTimeout(()=>focusEl.focus(),50); focusEl.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); if(getAnswer()!=="") check(true); } }); }

  function check(sure){
    const ans=getAnswer(); if(ans===""||ans==null) return;
    const g=grade(it,ans); record(e.level,e.key,g.ok,sure, it.type==="choice"? it.options[ans] : ans); s.results[s.i]=g.ok;
    task.querySelectorAll("input,textarea").forEach(x=>x.readOnly=true);
    body.querySelectorAll(".opt,.chip").forEach(x=>x.disabled=true);
    if(!g.ok){ task.classList.add("shake"); }
    tone(g.ok?"ok":"bad");
    const expected = it.type==="choice"? it.options[it.answer] : (it.answers||[])[0];
    const full = (it.type==="gap"? String(it.prompt).replace(/_{2,}/, expected) : expected).replace(/\s*\([^()]*\)\s*$/,"");  // sin pistas tipo "(negative)"
    const others = g.ok && it.answers && it.answers.length>1 ? it.answers.filter(a=>norm(a)!==norm(ans)).slice(0,2) : [];
    const cont=h("button",{class:"btn "+(g.ok?"okb":"badb"),onclick:()=>{s.i++;drawItem();}}, s.i+1<s.entries.length?"Continue":"See results");
    // En traducción, corrección y dictado puede haber respuestas válidas que no están en la lista.
    const override = (!g.ok && (it.hard || ["translate","fix","dictation"].includes(it.type)))
      ? h("button",{class:"btn",style:"min-height:40px;font-size:15px",onclick:()=>{ const r=rec(e.level,e.key); if(r){ r.f=Math.max(0,(r.f||1)-1); } record(e.level,e.key,true,false); s.results[s.i]=true; s.i++; drawItem(); }},"My answer is also correct") : null;
    footer.classList.add("sheet", g.ok?"ok":"bad");
    foot.replaceChildren(
      h("div",{class:"ttl fb-pop"}, svg(g.ok?IC.check:IC.cross), g.ok? (sure?"Correct!":"Correct, it will come back soon") : g.caseOnly? "Almost: check the capitalization" : g.close? "Almost: check the spelling" : "Correct answer:"),
      !g.ok? h("div",{class:"ans row",style:"padding:0;min-height:0"}, h("strong",{class:"grow"},full), spk(full)) : (others.length? h("div",{class:"tiny muted"},"Also correct: "+others.join(" · ")):null),
      it.explain? h("div",{class:"exp"},it.explain):null, cont, override);
    setTimeout(()=>cont.focus(),30);
  }
}
function drawSummary(){
  const s=S.session, ok=s.results.filter(Boolean).length, n=s.entries.length, pct=n?ok/n:0;
  const failed=s.entries.filter((_,k)=>!s.results[k]); const mins=Math.max(1,Math.round((Date.now()-s.start)/60000));
  tone("done");
  const {body,foot}=sessionShell();
  $(".pbar i").style.width="100%";
  body.append(h("div",{class:"celebrate"},
    h("div",{class:"big-ring"}, ring(pct,150,14, pct>=.8?"var(--ok)":"var(--accent)"), h("div",{class:"lbl"},`${Math.round(pct*100)}%`)),
    h("h2",{class:"q-instr"}, pct===1?"Perfect!": pct>=.8?"Great job!": pct>=.5?"Good progress":"Keep practicing"),
    h("p",{class:"muted"},`${ok} of ${n} correct · ${mins} min · ${todayCount()} of ${GOAL} today`)),
    failed.length? h("section",{}, h("h2",{class:"section-h"},"Coming back in your next review"), h("div",{class:"list plain"}, ...failed.map(e=>h("div",{class:"row"}, h("div",{class:"grow small"}, e.item.prompt||e.item.text||e.item.es))))):null);
  foot.append(failed.length? h("button",{class:"btn",onclick:()=>{ const f=failed; const ex=s.onExit; S.session=null; startSession(s.title+" · mistakes", f, ex); }},"Retry mistakes"):null,
    h("button",{class:"btn primary",onclick:closeSession},"Finish"));
}

/* ================= Arranque ================= */
async function loadJSON(f){ const r=await fetch("content/"+f,{cache:"no-cache"}); if(!r.ok) throw new Error(f+" "+r.status); return r.json(); }
async function boot(){
  S.prog=localLoad();
  try{
    S.catalog=await loadJSON("index.json");
    await Promise.all([
      loadJSON("recursos.json").then(d=>S.recursos=d).catch(()=>{}),
      loadJSON("lecturas.json").then(d=>S.lecturas=d).catch(()=>{}),
      Promise.all(PACKS.map(id=>loadJSON(`pack-${id}.json`).catch(()=>null))).then(a=>S.packs=a.filter(Boolean)),
      ...S.catalog.levels.map(async lv=>{
        await Promise.all(lv.units.map(async u=>{ try{ const d=await loadJSON(u.file); d._level=u.store||lv.id; d._lv=lv; d.n=u.n; S.units[d.id]=d; }catch(e){ console.warn(e); } }));
      })]);
  }catch(e){ view().replaceChildren(h("section",{class:"card"},h("p",{style:"color:var(--bad)"},"Couldn't load the material."),h("p",{class:"tiny muted"},String(e.message||e)))); return; }
  setSync(); render(); connect();
  // Precarga en segundo plano lo de Library para poder usarlo después sin conexión.
  setTimeout(()=>{ for (const f of ["pronunciacion.json","gramatica-perfil.json",...S.catalog.levels.filter(l=>l.id!=="anglo").flatMap(l=>[`vocab-${l.id}.json`,`oraciones-${l.id}.json`])]) lib(f); }, 2500);
}
async function connect(){
  const C=window.claude; if(!C||!C.use) return;
  try{
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection("data/users/"+uid);
    const stores=new Set(["lect","_stats","lib-pron","lib-ext"]);
    for (const lv of S.catalog.levels){ stores.add(lv.id); stores.add("lib-"+lv.id); for (const u of lv.units) stores.add(u.store||lv.id); }
    for (const id of stores){
      try{ const snap=await col.doc(id).get(); if(snap.exists){ S.prog[id] = id==="_stats"? mergeStats(stats(),snap.data()) : mergeProg(lp(id),snap.data()); } }catch(e){ console.warn(e); }
    }
    S.cloud=col; localSave();
    for (const k of Object.keys(S.prog)) dirty.add(k);
    setSync(); if(!S.session) render(); flush();
  }catch(e){ console.warn(e); setSync(); }
}
addEventListener("online", ()=>{ setSync(); if(S.cloud && !S.catalog) return; if(S.cloud) flush(); else if(S.catalog) connect(); });
addEventListener("offline", setSync);
boot();
